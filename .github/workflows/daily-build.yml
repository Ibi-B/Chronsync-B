name: Build Node B

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node B
        run: |
          mkdir -p raw_data public
          curl -L --fail "https://i.mjh.nz/PlutoTV/gb.xml.gz" | gunzip > raw_data/pluto_gb.xml
          curl -L --fail "https://i.mjh.nz/PlutoTV/de.xml.gz" | gunzip > raw_data/pluto_de.xml
          curl -L --fail "https://i.mjh.nz/PlutoTV/it.xml.gz" | gunzip > raw_data/pluto_it.xml
          curl -L --fail "https://i.mjh.nz/PlutoTV/es.xml.gz" | gunzip > raw_data/pluto_es.xml
          curl -L --fail "https://i.mjh.nz/SamsungTVPlus/gb.xml.gz" | gunzip > raw_data/sam_gb.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" | gunzip > raw_data/share_uk.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_IE1.xml.gz" | gunzip > raw_data/share_ie.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_DE1.xml.gz" | gunzip > raw_data/share_de.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz" | gunzip > raw_data/share_fr.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz" | gunzip > raw_data/share_it.xml
          curl -L --fail "https://epgshare01.online/epgshare01/epg_ripper_ES1.xml.gz" | gunzip > raw_data/share_es.xml
          python scripts/build_db.py public/b.sqlite3
          python scripts/validate_db.py public/b.sqlite3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - uses: actions/deploy-pages@v4
