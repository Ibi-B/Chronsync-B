name: Build Node B

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node B
        run: |
          set -euo pipefail
          mkdir -p raw_data public

          report="raw_data/source_report.tsv"
          printf 'source\turl\tbytes\tstatus\n' > "$report"

          fetch() {
            local url="$1"
            local output="$2"
            local compressed="${output}.gz"

            curl --fail --location --show-error --silent \
              "$url" \
              -o "$compressed"

            test -s "$compressed"
            gzip -t "$compressed"
            gunzip -c "$compressed" > "$output"
            test -s "$output"

            printf '%s\t%s\t%s\tok\n' \
              "$(basename "$output")" \
              "$url" \
              "$(stat -c%s "$output")" \
              >> "$report"
          }

          fetch "https://i.mjh.nz/PlutoTV/gb.xml.gz" "raw_data/pluto_gb.xml"
          fetch "https://i.mjh.nz/PlutoTV/de.xml.gz" "raw_data/pluto_de.xml"
          fetch "https://i.mjh.nz/PlutoTV/it.xml.gz" "raw_data/pluto_it.xml"
          fetch "https://i.mjh.nz/PlutoTV/es.xml.gz" "raw_data/pluto_es.xml"
          fetch "https://i.mjh.nz/SamsungTVPlus/gb.xml.gz" "raw_data/sam_gb.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" "raw_data/share_uk.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_IE1.xml.gz" "raw_data/share_ie.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_DE1.xml.gz" "raw_data/share_de.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz" "raw_data/share_fr.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz" "raw_data/share_it.xml"
          fetch "https://epgshare01.online/epgshare01/epg_ripper_ES1.xml.gz" "raw_data/share_es.xml"

          test "$(find raw_data -maxdepth 1 -name '*.xml' -type f | wc -l)" -eq 11

          for file in raw_data/*.xml; do
            python scripts/validate_epg.py "$file"
          done

          python scripts/build_db.py public/b.sqlite3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - uses: actions/deploy-pages@v4
