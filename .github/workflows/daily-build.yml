name: Build Node B

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Node B
        run: |
          set -euo pipefail
          mkdir -p raw_data public

          python scripts/fetch_feeds.py \
            --report raw_data/source_report.tsv \
            --feed "https://i.mjh.nz/PlutoTV/gb.xml.gz" "raw_data/pluto_gb.xml" \
            --feed "https://i.mjh.nz/PlutoTV/de.xml.gz" "raw_data/pluto_de.xml" \
            --feed "https://i.mjh.nz/PlutoTV/it.xml.gz" "raw_data/pluto_it.xml" \
            --feed "https://i.mjh.nz/PlutoTV/es.xml.gz" "raw_data/pluto_es.xml" \
            --feed "https://i.mjh.nz/SamsungTVPlus/gb.xml.gz" "raw_data/sam_gb.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" "raw_data/share_uk.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_IE1.xml.gz" "raw_data/share_ie.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_DE1.xml.gz" "raw_data/share_de.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz" "raw_data/share_fr.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz" "raw_data/share_it.xml" \
            --feed "https://epgshare01.online/epgshare01/epg_ripper_ES1.xml.gz" "raw_data/share_es.xml"

          # fetch_feeds.py validates each source independently and removes
          # rejected feeds, allowing the remaining usable sources to continue.
          python scripts/build_db.py public/b.sqlite3

      - name: Upload database artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: epg-database
          path: public/*.sqlite3
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
